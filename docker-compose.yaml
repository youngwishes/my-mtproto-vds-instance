services:
  api:
    build: .
    container_name: telemt-api
    ports:
      - "8080:8080"
    volumes:
      - ./src:/app/src/
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    logging:
      driver: "local"
      options:
        max-size: "10m"
        max-file: "3"
