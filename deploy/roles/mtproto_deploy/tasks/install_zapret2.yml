---
- name: Check for existing MTProto Zapret2 service
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ mtproto_zapret2_service_name }}.service"
  register: mtproto_zapret2_existing_service

- name: Check for an unmanaged Zapret2 nftables table
  ansible.builtin.command:
    argv: ["{{ mtproto_zapret2_nft_binary }}", list, table, ip, "{{ mtproto_zapret2_table }}"]
  register: mtproto_zapret2_existing_table
  changed_when: false
  failed_when: false

- name: Refuse to delete an unowned Zapret2 table
  ansible.builtin.assert:
    that:
      - mtproto_zapret2_existing_service.stat.exists or mtproto_zapret2_existing_table.rc != 0
    fail_msg: >-
      Refusing to delete existing nftables table {{ mtproto_zapret2_table }} without
      the managed {{ mtproto_zapret2_service_name }} service marker

- name: Read active NFQUEUE registry before Zapret2 cutover
  ansible.builtin.shell: |
    if test -r /proc/net/netfilter/nfnetlink_queue; then
      cat /proc/net/netfilter/nfnetlink_queue
    fi
  args:
    executable: /bin/bash
  register: mtproto_zapret2_queue_registry
  changed_when: false
  when: not mtproto_zapret2_existing_service.stat.exists

- name: Read nftables queue rules before Zapret2 cutover
  ansible.builtin.command:
    argv:
      - "{{ mtproto_zapret2_nft_binary }}"
      - list
      - ruleset
  register: mtproto_zapret2_queue_rules
  changed_when: false
  when: not mtproto_zapret2_existing_service.stat.exists

- name: Verify Zapret2 NFQUEUE is available
  ansible.builtin.import_tasks: assert_zapret2_queue_available.yml
  when: not mtproto_zapret2_existing_service.stat.exists

- name: Create Zapret2 runtime directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ mtproto_zapret2_install_dir }}/bin"
      mode: "0755"
    - path: "{{ mtproto_zapret2_lua_dir }}"
      mode: "0755"
    - path: "{{ mtproto_zapret2_config_path | dirname }}"
      mode: "0755"

- name: Install Zapret2 nfqws2 binary
  ansible.builtin.copy:
    src: "{{ mtproto_zapret2_extract_dir }}/binaries/{{ mtproto_zapret2_release_arch }}/nfqws2"
    dest: "{{ mtproto_zapret2_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart MTProto Zapret2

- name: Install upstream Zapret2 Lua libraries
  ansible.builtin.copy:
    src: "{{ mtproto_zapret2_extract_dir }}/lua/{{ item }}"
    dest: "{{ mtproto_zapret2_lua_dir }}/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - zapret-lib.lua
    - zapret-antidpi.lua
  notify: Restart MTProto Zapret2

- name: Install MTProto Zapret2 Lua strategy
  ansible.builtin.template:
    src: mtproto-zapret2.lua.j2
    dest: "{{ mtproto_zapret2_lua_dir }}/mtproto.lua"
    owner: root
    group: root
    mode: "0644"
  notify: Restart MTProto Zapret2

- name: Install MTProto Zapret2 configuration
  ansible.builtin.template:
    src: mtproto-zapret2.conf.j2
    dest: "{{ mtproto_zapret2_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart MTProto Zapret2

- name: Install MTProto Zapret2 startup script
  ansible.builtin.template:
    src: mtpr-zapret2-start.sh.j2
    dest: "{{ mtproto_zapret2_start_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart MTProto Zapret2

- name: Install MTProto Zapret2 readiness probe
  ansible.builtin.template:
    src: mtpr-zapret2-ready.sh.j2
    dest: "{{ mtproto_zapret2_ready_script_path }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart MTProto Zapret2

- name: Install MTProto Zapret2 service
  ansible.builtin.template:
    src: mtpr-zapret2.service.j2
    dest: "/etc/systemd/system/{{ mtproto_zapret2_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart MTProto Zapret2
