---
- name: Set canonical swap target size
  ansible.builtin.set_fact:
    mtproto_swap_target_bytes: "{{ mtproto_swap_size_mb | int * 1024 * 1024 }}"

- name: Inspect canonical swap file
  ansible.builtin.stat:
    path: "{{ mtproto_swap_path }}"
  register: mtproto_swapfile

- name: Read active swaps before changes
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: mtproto_active_swaps_before
  changed_when: false

- name: Require no unexpected active swap before changes
  ansible.builtin.assert:
    that:
      - >-
        mtproto_active_swaps_before.stdout_lines | map('trim') |
        reject('equalto', '') | difference([mtproto_swap_path]) | length == 0
      - >-
        mtproto_swapfile.stat.exists or
        mtproto_active_swaps_before.stdout_lines | map('trim') |
        reject('equalto', '') | list | length == 0
    fail_msg: >-
      Unexpected active swap found. Remove it manually before rerunning the
      playbook; {{ mtproto_swap_path }} is the only supported swap.

- name: Read existing canonical swap size
  ansible.builtin.command:
    argv: [stat, -c, "%s", "{{ mtproto_swap_path }}"]
  register: mtproto_swap_size
  changed_when: false
  when: mtproto_swapfile.stat.exists

- name: Read existing canonical swap signature
  ansible.builtin.command:
    argv: [blkid, -p, -s, TYPE, -o, value, "{{ mtproto_swap_path }}"]
  register: mtproto_swap_signature
  changed_when: false
  failed_when: false
  when: mtproto_swapfile.stat.exists

- name: Validate existing canonical swap
  ansible.builtin.assert:
    that:
      - mtproto_swap_size.stdout | int == mtproto_swap_target_bytes | int
      - mtproto_swap_signature.rc == 0
      - mtproto_swap_signature.stdout | trim == 'swap'
    fail_msg: >-
      Existing {{ mtproto_swap_path }} must be exactly
      {{ mtproto_swap_size_mb }} MiB and have a valid swap signature.
  when: mtproto_swapfile.stat.exists

- name: Create missing canonical swap
  ansible.builtin.command:
    argv: [fallocate, -l, "{{ mtproto_swap_size_mb }}M", "{{ mtproto_swap_path }}"]
  when: not mtproto_swapfile.stat.exists

- name: Protect canonical swap
  ansible.builtin.file:
    path: "{{ mtproto_swap_path }}"
    state: file
    owner: root
    group: root
    mode: "0600"

- name: Format new canonical swap
  ansible.builtin.command:
    argv: [mkswap, "{{ mtproto_swap_path }}"]
  when: not mtproto_swapfile.stat.exists

- name: Activate canonical swap
  ansible.builtin.command:
    argv: [swapon, "{{ mtproto_swap_path }}"]
  when: >-
    mtproto_swap_path not in
    (mtproto_active_swaps_before.stdout_lines | map('trim') | list)

- name: Persist canonical swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^{{ mtproto_swap_path | regex_escape }}\s'
    line: "{{ mtproto_swap_path }} none swap sw 0 0"
    state: present

- name: Read active swaps after activation
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: mtproto_active_swaps_after
  changed_when: false

- name: Require canonical swap to be the only active swap
  ansible.builtin.assert:
    that:
      - >-
        mtproto_active_swaps_after.stdout_lines | map('trim') | reject('equalto', '') | list
        == [mtproto_swap_path]
    fail_msg: >-
      {{ mtproto_swap_path }} must be the only active swap. Remove unexpected
      swap devices manually before rerunning the playbook.
