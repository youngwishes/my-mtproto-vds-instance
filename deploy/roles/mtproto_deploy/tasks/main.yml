---
- name: Check if swap already exists
  ansible.builtin.stat:
    path: /swapfile
  register: mtproto_swapfile

- name: Create swap file
  ansible.builtin.command: fallocate -l {{ mtproto_swap_size_mb }}M /swapfile
  when: not mtproto_swapfile.stat.exists

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: Format swap
  ansible.builtin.command: mkswap /swapfile
  when: not mtproto_swapfile.stat.exists

- name: Read active swap devices
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: mtproto_active_swaps
  changed_when: false

- name: Record whether the swap file is active
  ansible.builtin.set_fact:
    mtproto_swap_active: >-
      {{ '/swapfile' in (mtproto_active_swaps.stdout_lines | map('trim') | list) }}

- name: Enable swap
  ansible.builtin.command: swapon /swapfile
  when: not mtproto_swap_active

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: /swapfile none swap sw 0 0
    state: present

- name: Set swappiness to 10
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    sysctl_file: /etc/sysctl.d/99-swappiness.conf

- name: Install deployment and host runtime dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - iptables
      - nftables
      - tar
    state: present
    update_cache: true

- name: Install Docker if not present
  ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker

- name: Ensure Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Clone or update repository
  ansible.builtin.git:
    repo: "{{ mtproto_repo_url }}"
    dest: "{{ mtproto_deploy_dir }}"
    version: "{{ mtproto_repo_branch }}"
    force: true

- name: Validate Telemt release architecture
  ansible.builtin.assert:
    that:
      - ansible_facts["architecture"] in telemt_release_arches
    fail_msg: >-
      Unsupported Telemt architecture: {{ ansible_facts["architecture"] }}

- name: Select Telemt release architecture
  ansible.builtin.set_fact:
    telemt_release_arch: >-
      {{ telemt_release_arches[ansible_facts["architecture"]] }}

- name: Create Telemt download directory
  ansible.builtin.file:
    path: "{{ telemt_download_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Telemt checksum
  ansible.builtin.get_url:
    url: >-
      {{ telemt_release_base_url }}/{{ telemt_version }}/{{ telemt_archive_name }}.sha256
    dest: "{{ telemt_download_dir }}/{{ telemt_archive_name }}.sha256"
    owner: root
    group: root
    mode: "0644"

- name: Download Telemt archive
  ansible.builtin.get_url:
    url: >-
      {{ telemt_release_base_url }}/{{ telemt_version }}/{{ telemt_archive_name }}
    dest: "{{ telemt_download_dir }}/{{ telemt_archive_name }}"
    owner: root
    group: root
    mode: "0644"

- name: Verify downloaded Telemt checksum
  ansible.builtin.command:
    cmd: "sha256sum --check {{ telemt_archive_name }}.sha256"
    chdir: "{{ telemt_download_dir }}"
  changed_when: false

- name: Extract Telemt binary
  ansible.builtin.unarchive:
    src: "{{ telemt_download_dir }}/{{ telemt_archive_name }}"
    dest: "{{ telemt_download_dir }}"
    remote_src: true

- name: Install Telemt binary
  ansible.builtin.copy:
    src: "{{ telemt_download_dir }}/telemt"
    dest: "{{ telemt_binary_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  notify: Restart Telemt

- name: Verify installed Telemt version
  ansible.builtin.command:
    cmd: "{{ telemt_binary_path }} --version"
  register: telemt_version_output
  changed_when: false
  failed_when: >-
    telemt_version_output.rc != 0 or
    telemt_version_output.stdout | trim != ("telemt " ~ telemt_version)

- name: Create Telemt system group
  ansible.builtin.group:
    name: telemt
    system: true
    state: present

- name: Create Telemt system user
  ansible.builtin.user:
    name: telemt
    group: telemt
    home: "{{ telemt_work_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
    state: present

- name: Create Telemt working directory
  ansible.builtin.file:
    path: "{{ telemt_work_dir }}"
    state: directory
    owner: telemt
    group: telemt
    mode: "0750"

- name: Ensure Telemt config directory is writable by Telemt
  ansible.builtin.file:
    path: "{{ mtproto_deploy_dir }}/telemt"
    state: directory
    owner: telemt
    group: telemt
    mode: "0750"

- name: Create Telemt config from example on clean install
  ansible.builtin.copy:
    src: "{{ mtproto_deploy_dir }}/telemt/telemt.example.toml"
    dest: "{{ telemt_config_path }}"
    remote_src: true
    force: false
    owner: telemt
    group: telemt
    mode: "0640"

- name: Allow Telemt API to update its config atomically
  ansible.builtin.file:
    path: "{{ telemt_config_path }}"
    state: file
    owner: telemt
    group: telemt
    mode: "0640"

- name: Install Telemt systemd unit
  ansible.builtin.template:
    src: telemt.service.j2
    dest: "/etc/systemd/system/{{ telemt_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Telemt

- name: Create .env from example (skip if already exists)
  ansible.builtin.copy:
    src: "{{ mtproto_deploy_dir }}/.env.example"
    dest: "{{ mtproto_deploy_dir }}/.env"
    remote_src: true
    force: false

- name: Route FastAPI to Telemt on the Docker host
  ansible.builtin.lineinfile:
    path: "{{ mtproto_deploy_dir }}/.env"
    regexp: '^TELEMT_API_ROOT='
    line: "TELEMT_API_ROOT={{ telemt_api_root }}"
    create: false

- name: Prepare pinned MTProto Zapret2 release
  ansible.builtin.import_tasks: prepare_zapret2.yml

- name: Install MTProto Zapret2 V4
  ansible.builtin.import_tasks: install_zapret2.yml

- name: Apply pending service restarts
  ansible.builtin.meta: flush_handlers

- name: Ensure MTProto Zapret2 service is running
  ansible.builtin.systemd_service:
    name: "{{ mtproto_zapret2_service_name }}.service"
    state: started
    enabled: true
    daemon_reload: true

- name: Ensure Telemt systemd service is running
  ansible.builtin.systemd_service:
    name: "{{ telemt_service_name }}"
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for Telemt liveness
  ansible.builtin.command:
    cmd: >-
      {{ telemt_binary_path }} healthcheck {{ telemt_config_path }}
      --mode liveness
  register: telemt_liveness
  changed_when: false
  retries: 6
  delay: 5
  until: telemt_liveness.rc == 0

- name: Probe a missing user directly through Telemt
  ansible.builtin.uri:
    url: http://127.0.0.1:9091/v1/users/__ansible_connectivity_probe__
    method: GET
    status_code: 404
    return_content: true
  register: telemt_missing_user

- name: Start FastAPI container
  ansible.builtin.command:
    cmd: docker compose up -d --build --remove-orphans api
    chdir: "{{ mtproto_deploy_dir }}"

- name: Verify FastAPI can reach host Telemt without changing config
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/api/users/__ansible_connectivity_probe__
    method: GET
    status_code: 404
    return_content: true
  register: fastapi_missing_user
  retries: 6
  delay: 2
  until: >-
    fastapi_missing_user.get('status', -1) == 404 and
    fastapi_missing_user.get('json', {}).get('detail', '') ==
    telemt_missing_user.json.error.message
